name: Refresh profile artwork

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'tools/generate_stats.py'

permissions:
  contents: read

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate public project statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/generate_stats.py
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: m1koz
          outputs: |
            dist/contributions-light.svg?color_snake=%230969da&color_dots=%23ebedf0,%23dbeafe,%2393c5fd,%233b82f6,%231d4ed8
            dist/contributions-dark.svg?palette=github-dark&color_snake=%2379c0ff&color_dots=%23161b22,%23152f4f,%231e4e7d,%233b82f6,%2379c0ff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-artwork
          path: dist/*.svg
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-artwork
          path: ${{ runner.temp }}/profile-artwork
      - name: Publish generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git switch --force-create output FETCH_HEAD
          else
            git switch --orphan output
          fi
          cp "$RUNNER_TEMP/profile-artwork/"*.svg .
          git add -- stats-dark.svg stats-light.svg contributions-dark.svg contributions-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh profile artwork'
          git push origin HEAD:output
